<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0e14">
<title>たいせん！ジャンプアドベンチャー</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;width:100%;height:100%;overflow:hidden;
    background:#000;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;
  }
  #cv{display:block;position:fixed;inset:0;}

  .controls{
    position:fixed;left:0;right:0;height:50%;
    display:flex;align-items:flex-end;justify-content:space-between;
    pointer-events:none;z-index:10;
    padding-left:22px;padding-right:22px;
  }
  .controls.bottom{
    bottom:0;
    padding-bottom:calc(16px + env(safe-area-inset-bottom));
  }
  .controls.top{
    top:0;
    transform:rotate(180deg);
    padding-bottom:calc(16px + env(safe-area-inset-top));
  }
  .group{display:flex;gap:16px;align-items:flex-end;}

  .btn{
    pointer-events:auto;
    width:clamp(62px, 10.5vh, 96px);
    height:clamp(62px, 10.5vh, 96px);
    border-radius:50%;
    border:3px solid rgba(255,255,255,.72);
    background:rgba(255,255,255,.20);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    color:#fff;font-size:clamp(20px,3.4vh,32px);font-weight:900;line-height:1;
    display:flex;align-items:center;justify-content:center;
    touch-action:none;user-select:none;padding:0;
    box-shadow:0 6px 20px rgba(0,0,0,.32);
    transition:transform .07s ease,background .07s ease;
    font-family:inherit;
  }
  .btn.jump{
    width:clamp(76px, 13vh, 118px);
    height:clamp(76px, 13vh, 118px);
    font-size:clamp(13px,2.1vh,19px);
    letter-spacing:1px;
  }
  .btn.active{transform:scale(.88);background:rgba(255,255,255,.62);}
  .btn.p0{border-color:rgba(255,110,110,.95);background:rgba(230,57,70,.30);}
  .btn.p0.active{background:rgba(230,57,70,.68);}
  .btn.p1{border-color:rgba(120,230,140,.95);background:rgba(47,168,79,.30);}
  .btn.p1.active{background:rgba(47,168,79,.72);}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="controls bottom">
  <div class="group">
    <button class="btn p0" data-p="0" data-k="left">◀</button>
    <button class="btn p0" data-p="0" data-k="right">▶</button>
  </div>
  <div class="group">
    <button class="btn p0 jump" data-p="0" data-k="jump">JUMP</button>
  </div>
</div>

<div class="controls top">
  <div class="group">
    <button class="btn p1" data-p="1" data-k="left">◀</button>
    <button class="btn p1" data-p="1" data-k="right">▶</button>
  </div>
  <div class="group">
    <button class="btn p1 jump" data-p="1" data-k="jump">JUMP</button>
  </div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   基本定数
   ========================================================= */
const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d', { alpha:false });

const GROUND_Y     = 400;
const WORLD_VIEW_H = 360;
const CAM_Y        = 112;
const GRAVITY      = 2200;
const JUMP_V       = -790;
const MAX_FALL     = 1350;
const MAX_VX       = 252;

const SMALL_W = 28, SMALL_H = 40;
const BIG_W   = 32, BIG_H   = 56;

let scale = 1;
let viewW = 960;

/* =========================================================
   リサイズ
   ========================================================= */
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, window.innerWidth);
  const h = Math.max(1, window.innerHeight);
  cv.width  = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  cv.style.width  = w + 'px';
  cv.style.height = h + 'px';
  const halfH = cv.height / 2;
  scale = halfH / WORLD_VIEW_H;
  viewW = cv.width / scale;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=>setTimeout(resize,180));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

/* =========================================================
   ユーティリティ
   ========================================================= */
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const frac  = x => x - Math.floor(x);
const rnd   = (a,b)=> a + Math.random()*(b-a);
const rndI  = (a,b)=> Math.floor(rnd(a, b+1));

function aabb(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}
function roundRect(c,x,y,w,h,r){
  r = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}
function starPath(c, cx, cy, outerR, innerR, points){
  c.beginPath();
  for (let i=0;i<points*2;i++){
    const r = i%2 === 0 ? outerR : innerR;
    const a = -Math.PI/2 + i*Math.PI/points;
    const x = cx + Math.cos(a)*r;
    const y = cy + Math.sin(a)*r;
    if (i===0) c.moveTo(x,y); else c.lineTo(x,y);
  }
  c.closePath();
}

/* =========================================================
   オーディオ
   ========================================================= */
let audioCtx = null;
let masterGain = null;
let bgmGain = null;
let sfxGain = null;
let noiseBuffer = null;
let bgmState = null;
let bgmTimer = null;
let audioInited = false;

function initAudio(){
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.65;
  masterGain.connect(audioCtx.destination);

  bgmGain = audioCtx.createGain();
  bgmGain.gain.value = 0.20;
  bgmGain.connect(masterGain);

  sfxGain = audioCtx.createGain();
  sfxGain.gain.value = 0.42;
  sfxGain.connect(masterGain);

  // ノイズバッファ（スネア・ハイハット用）
  const len = audioCtx.sampleRate * 0.6;
  noiseBuffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = noiseBuffer.getChannelData(0);
  for (let i=0;i<len;i++) d[i] = Math.random()*2-1;
}

function ensureAudio(){
  if (audioInited) return;
  try {
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    startBGM();
    audioInited = true;
  } catch(e){}
}
document.addEventListener('pointerdown', ensureAudio, true);
document.addEventListener('keydown', ensureAudio, true);

/* ---------- 効果音 ---------- */
function playTone(freq, t0, dur, wave, vol, freqEnd){
  if (!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = wave || 'square';
  o.frequency.setValueAtTime(freq, t0);
  if (freqEnd != null)
    o.frequency.exponentialRampToValueAtTime(Math.max(1,freqEnd), t0+dur);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol, t0+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g); g.connect(sfxGain);
  o.start(t0); o.stop(t0+dur+0.03);
}

function sfx(type){
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  switch(type){
    case 'jump':    playTone(280, t, 0.14, 'square', 0.20, 720); break;
    case 'coin':
      playTone(988,  t, 0.07, 'square', 0.18);
      playTone(1319, t+0.06, 0.18, 'square', 0.18);
      break;
    case 'stomp':   playTone(240, t, 0.14, 'square', 0.24, 70); break;
    case 'block':
      playTone(180, t, 0.07, 'square', 0.22, 90);
      playTone(90,  t+0.02, 0.10, 'triangle', 0.16);
      break;
    case 'emerge':  playTone(500, t, 0.10, 'square', 0.16, 1100); break;
    case 'powerup':
      [523,659,784,1047,1319].forEach((f,i)=> playTone(f, t+i*0.05, 0.18, 'square', 0.20));
      break;
    case 'shrink':
      [880,660,440,330].forEach((f,i)=> playTone(f, t+i*0.05, 0.16, 'square', 0.22));
      break;
    case 'die':
      [523,392,330,262,196].forEach((f,i)=> playTone(f, t+i*0.09, 0.22, 'triangle', 0.24));
      break;
    case 'goal':
      [523,659,784,1047,1319,1047,1319,1568].forEach((f,i)=>
        playTone(f, t+i*0.09, 0.28, 'square', 0.22));
      break;
  }
}

/* ---------- BGM 生成（本格的なコード進行ベース） ---------- */
function playBgmTone(freq, t, dur, wave, vol){
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = wave || 'sine';
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t+0.008);
  g.gain.setValueAtTime(vol, t + dur*0.65);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(bgmGain);
  o.start(t); o.stop(t+dur+0.02);
}

function playKick(t){
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(150, t);
  o.frequency.exponentialRampToValueAtTime(40, t+0.10);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.32, t+0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.18);
  o.connect(g); g.connect(bgmGain);
  o.start(t); o.stop(t+0.22);
}

function playSnare(t){
  const src = audioCtx.createBufferSource();
  src.buffer = noiseBuffer;
  const hp = audioCtx.createBiquadFilter();
  hp.type = 'highpass'; hp.frequency.value = 1200;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.16, t+0.003);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.13);
  src.connect(hp); hp.connect(g); g.connect(bgmGain);
  src.start(t); src.stop(t+0.15);

  const o = audioCtx.createOscillator();
  const g2 = audioCtx.createGain();
  o.type = 'triangle'; o.frequency.value = 200;
  g2.gain.setValueAtTime(0.0001, t);
  g2.gain.linearRampToValueAtTime(0.10, t+0.003);
  g2.gain.exponentialRampToValueAtTime(0.0001, t+0.08);
  o.connect(g2); g2.connect(bgmGain);
  o.start(t); o.stop(t+0.1);
}

function playHiHat(t, accent){
  const src = audioCtx.createBufferSource();
  src.buffer = noiseBuffer;
  const hp = audioCtx.createBiquadFilter();
  hp.type = 'highpass'; hp.frequency.value = 7000;
  const g = audioCtx.createGain();
  const vol = accent ? 0.05 : 0.028;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t+0.002);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.035);
  src.connect(hp); hp.connect(g); g.connect(bgmGain);
  src.start(t); src.stop(t+0.05);
}

function generateBGM(){
  const rootFreqs = [130.81, 146.83, 164.81, 174.61, 196.00, 220.00];
  const root = rootFreqs[rndI(0, rootFreqs.length-1)];
  const isMinor = Math.random() < 0.45;
  const scale = isMinor ? [0,2,3,5,7,8,10] : [0,2,4,5,7,9,11];

  const progMajor = [
    [0,4,5,3],[0,5,3,4],[0,3,4,5],[5,3,0,4],[3,4,0,0],[0,3,0,4]
  ];
  const progMinor = [
    [0,5,3,4],[0,3,4,0],[0,5,2,4],[0,6,5,4],[0,4,5,3]
  ];
  const prog = isMinor
    ? progMinor[rndI(0,progMinor.length-1)]
    : progMajor[rndI(0,progMajor.length-1)];

  const bpm = 100 + Math.random()*30;
  const beatDur = 60/bpm;
  const bars = 8;
  const stepsPerBar = 8;   // 8分音符

  // メロディ
  const melody = [];
  for (let bar=0; bar<bars; bar++){
    const cd = prog[bar % prog.length];
    const chordTones = [cd, cd+2, cd+4];
    for (let s=0; s<stepsPerBar; s++){
      let chance = 0.35;
      if (s === 0) chance = 0.95;
      else if (s === 4) chance = 0.78;
      else if (s === 2 || s === 6) chance = 0.55;
      if (bar >= 4) chance += 0.08;

      if (Math.random() < chance){
        let deg;
        if (Math.random() < 0.65){
          deg = chordTones[rndI(0, chordTones.length-1)];
        } else {
          deg = rndI(0, 6);
        }
        const oct = Math.random() < 0.25 ? 1 : 0;
        melody.push({deg, oct});
      } else {
        melody.push(null);
      }
    }
  }

  // ベース
  const bass = [];
  for (let bar=0; bar<bars; bar++){
    const cd = prog[bar % prog.length];
    for (let beat=0; beat<4; beat++){
      if (beat === 0 || (beat === 2 && Math.random() < 0.85) ||
          (beat === 3 && Math.random() < 0.18)){
        bass.push({deg: cd, oct: 0});
      } else {
        bass.push(null);
      }
    }
  }

  // アルペジオ伴奏
  const arp = [];
  for (let bar=0; bar<bars; bar++){
    const cd = prog[bar % prog.length];
    const chord = [cd, cd+2, cd+4, cd+2];
    for (let s=0; s<stepsPerBar; s++){
      arp.push({deg: chord[s % 4], oct: 0});
    }
  }

  return {
    root, scale, isMinor,
    bpm, beatDur, prog, bars, stepsPerBar,
    melody, bass, arp,
    step: 0, maxStep: bars*stepsPerBar,
    nextTime: 0, active: true
  };
}

function scheduleBGM(){
  if (!bgmState || !bgmState.active) return;
  const lookahead = 0.3;
  const now = audioCtx.currentTime;
  if (bgmState.nextTime < now) bgmState.nextTime = now + 0.05;
  const stepDur = bgmState.beatDur / 2;

  while (bgmState.nextTime < now + lookahead){
    playBgmStep(bgmState.step, bgmState.nextTime);
    bgmState.step = (bgmState.step + 1) % bgmState.maxStep;
    bgmState.nextTime += stepDur;
  }
  bgmTimer = setTimeout(scheduleBGM, 90);
}

function playBgmStep(step, t){
  const s = bgmState;
  const bar = Math.floor(step / s.stepsPerBar);
  const sib = step % s.stepsPerBar;

  // メロディ
  const m = s.melody[step];
  if (m){
    const oct = Math.floor(m.deg / 7);
    const deg = ((m.deg % 7) + 7) % 7;
    const semi = s.scale[deg] + oct*12 + m.oct*12;
    const freq = s.root * Math.pow(2, semi/12) * 2;
    playBgmTone(freq, t, s.beatDur*0.38, 'square', 0.042);
  }

  // ベース（拍1・拍3）
  const beatInBar = Math.floor(sib/2);
  const b = s.bass[bar*4 + beatInBar];
  if (b && sib % 2 === 0){
    const oct = Math.floor(b.deg / 7);
    const deg = ((b.deg % 7) + 7) % 7;
    const semi = s.scale[deg] + oct*12;
    const freq = s.root * Math.pow(2, semi/12);
    playBgmTone(freq, t, s.beatDur*0.9, 'triangle', 0.085);
  }

  // アルペジオ
  const a = s.arp[step];
  if (a){
    const oct = Math.floor(a.deg / 7);
    const deg = ((a.deg % 7) + 7) % 7;
    const semi = s.scale[deg] + oct*12;
    const freq = s.root * Math.pow(2, semi/12) * 2;
    playBgmTone(freq, t, s.beatDur*0.14, 'sine', 0.020);
  }

  // ドラム
  if (sib === 0 || sib === 4) playKick(t);
  if (sib === 2 || sib === 6) playSnare(t);
  playHiHat(t, sib % 2 === 0);
}

function startBGM(){
  if (!audioCtx) return;
  stopBGM();
  bgmState = generateBGM();
  bgmState.nextTime = audioCtx.currentTime + 0.18;
  scheduleBGM();
}
function stopBGM(){
  if (bgmState) bgmState.active = false;
  if (bgmTimer){ clearTimeout(bgmTimer); bgmTimer = null; }
  bgmState = null;
}

/* =========================================================
   レベル生成（重なり回避）
   ========================================================= */
let solids = [];
let coins = [];
let enemies = [];
let powerups = [];
let particles = [];
let GOAL_X = 3000;
let LEVEL_W = 3400;

function generateLevel(){
  solids = []; coins = []; enemies = []; powerups = []; particles = [];

  const occupied = [];  // コインやブロック配置回避用
  function addOcc(x,y,w,h){ occupied.push({x,y,w,h}); }
  function isFree(x,y,w,h,margin){
    margin = margin || 0;
    for (const o of occupied){
      if (x < o.x + o.w + margin && x + w + margin > o.x &&
          y < o.y + o.h + margin && y + h + margin > o.y) return false;
    }
    return true;
  }

  // 最初の地面
  solids.push({x:-200, y:GROUND_Y, w:1000, h:220, ground:true});

  let x = 800;
  const target = 3400 + Math.random()*2000;

  while (x < target){
    const gap  = rnd(95, 148);
    const segW = rnd(260, 640);
    const sx   = x + gap;

    solids.push({x:sx, y:GROUND_Y, w:segW, h:220, ground:true});

    /* --- 敵 --- */
    const nE = segW > 470 ? 2 : 1;
    for (let i=0;i<nE;i++){
      const ex = sx + 70 + Math.random()*(segW-150);
      enemies.push({
        x:ex, y:GROUND_Y-30, w:34, h:30,
        vx:(Math.random()<0.5?-1:1)*58,
        min: sx+18, max: sx+segW-18,
        dead:false, timer:0, anim: Math.random()*10
      });
    }

    /* --- 浮遊足場（1つ） --- */
    let platform = null;
    if (Math.random() < 0.82){
      const pw = rnd(90,160);
      const px = sx + 30 + Math.random()*Math.max(1, segW - pw - 60);
      const py = GROUND_Y - 100 - Math.random()*35;
      platform = {x:px, y:py, w:pw, h:24};
      solids.push(platform);
      addOcc(px, py, pw, 24);

      // 足場の上にコイン（さらに高い位置

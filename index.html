<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#4db8ff">
<title>ジャンプアドベンチャー</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;width:100%;height:100%;overflow:hidden;
    background:#000;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;
  }
  #cv{display:block;position:fixed;inset:0;}

  #hud{
    position:fixed;left:0;right:0;top:0;
    padding:calc(12px + env(safe-area-inset-top)) 20px 12px;
    display:flex;justify-content:space-between;align-items:center;
    color:#fff;font-weight:800;font-size:17px;letter-spacing:.5px;
    text-shadow:0 2px 6px rgba(0,0,0,.45);
    pointer-events:none;z-index:5;
  }
  #hud .item{display:flex;align-items:center;gap:8px;
    background:rgba(0,0,0,.18);border:2px solid rgba(255,255,255,.35);
    border-radius:999px;padding:6px 16px;backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);}
  #hud .coin{color:#ffd23f;}

  .pad{position:fixed;bottom:calc(26px + env(safe-area-inset-bottom));
       display:flex;gap:20px;z-index:10;}
  .pad.left{left:calc(26px + env(safe-area-inset-left));}
  .pad.right{right:calc(26px + env(safe-area-inset-right));}

  .btn{
    width:84px;height:84px;border-radius:50%;
    border:3px solid rgba(255,255,255,.7);
    background:rgba(255,255,255,.22);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    color:#fff;font-size:30px;font-weight:900;line-height:1;
    display:flex;align-items:center;justify-content:center;
    touch-action:none;user-select:none;padding:0;
    box-shadow:0 6px 18px rgba(0,0,0,.25);
    transition:transform .07s ease,background .07s ease;
  }
  .btn.jump{width:104px;height:104px;font-size:17px;letter-spacing:1.5px;
            background:rgba(255,90,90,.32);border-color:rgba(255,255,255,.8);}
  .btn.active{transform:scale(.9);background:rgba(255,255,255,.55);}
  .btn.jump.active{background:rgba(255,90,90,.65);}

  #msg{
    position:fixed;inset:0;display:none;z-index:20;
    flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:rgba(10,20,40,.62);backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);color:#fff;text-align:center;padding:24px;
  }
  #msg.show{display:flex;}
  #msgTitle{font-size:38px;font-weight:900;margin:0;
    text-shadow:0 4px 16px rgba(0,0,0,.6);letter-spacing:2px;}
  #msgSub{font-size:17px;margin:0;opacity:.9;font-weight:600;}
  #msgBtn{
    margin-top:14px;padding:16px 46px;border-radius:999px;border:none;
    background:linear-gradient(180deg,#ffd94a,#f5a623);
    color:#5a3200;font-size:19px;font-weight:900;letter-spacing:1px;
    box-shadow:0 8px 22px rgba(0,0,0,.35);cursor:pointer;
  }
  #msgBtn:active{transform:scale(.95);}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud">
  <div class="item"><span class="coin">●</span><span id="coinUI">0</span></div>
  <div class="item">SCORE <span id="scoreUI">0</span></div>
</div>

<div class="pad left">
  <button class="btn" id="btnLeft" aria-label="左">◀</button>
  <button class="btn" id="btnRight" aria-label="右">▶</button>
</div>
<div class="pad right">
  <button class="btn jump" id="btnJump" aria-label="ジャンプ">JUMP</button>
</div>

<div id="msg">
  <h1 id="msgTitle"></h1>
  <p id="msgSub"></p>
  <button id="msgBtn">もう一度あそぶ</button>
</div>

<script>
(function(){
'use strict';

/* ================= 基本設定 ================= */
const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d', { alpha:false });

const VIEW_H     = 480;      // 画面に映す世界の高さ（基準）
const MIN_VIEW_W = 580;      // 最低限見える幅
const GROUND_Y   = 400;      // 地面の上面
const LEVEL_W    = 3320;

let scale = 1, viewW = 960, viewH = 480;
let camX = 0, camY = 0;

/* ================= リサイズ ================= */
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, window.innerWidth);
  const h = Math.max(1, window.innerHeight);
  cv.width  = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  cv.style.width  = w + 'px';
  cv.style.height = h + 'px';
  scale = Math.min(cv.height / VIEW_H, cv.width / MIN_VIEW_W);
  viewW = cv.width  / scale;
  viewH = cv.height / scale;
  camY  = 480 - viewH;   // 地面が下に来るように
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=>setTimeout(resize,150));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
resize();

/* ================= ユーティリティ ================= */
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
function aabb(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}
function roundRect(c,x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}

/* ================= レベルデータ ================= */
const solids = [
  // 地面
  {x:-100, y:GROUND_Y, w:1040, h:180, ground:true},   // -100 ～ 940
  {x:1020, y:GROUND_Y, w:680,  h:180, ground:true},   // 1020 ～ 1700
  {x:1800, y:GROUND_Y, w:1520, h:180, ground:true},   // 1800 ～ 3320
  // 浮遊足場
  {x:260,  y:296, w:120, h:26},
  {x:470,  y:232, w:120, h:26},
  {x:660,  y:296, w:120, h:26},
  {x:1080, y:288, w:150, h:26},
  {x:1310, y:216, w:120, h:26},
  {x:1500, y:288, w:150, h:26},
  {x:1880, y:300, w:120, h:26},
  {x:2090, y:236, w:120, h:26},
  {x:2300, y:296, w:150, h:26},
  {x:2560, y:240, w:120, h:26}
];

const coinSpots = [
  // 足場の上
  [275,258],[315,258],[355,258],
  [490,194],[530,194],[570,194],
  [680,258],[720,258],[760,258],
  [1100,250],[1140,250],[1180,250],
  [1330,178],[1370,178],
  [1520,250],[1560,250],[1600,250],
  [1900,262],[1940,262],
  [2110,198],[2150,198],
  [2320,258],[2360,258],[2400,258],
  [2580,202],[2620,202],
  // 地上
  [140,352],[180,352],
  [830,352],[870,352],
  // 谷の上
  [955,338],[985,306],[1015,338],
  [1718,338],[1750,306],[1782,338],
  // ゴール前
  [2760,352],[2800,352],[2840,352]
];

const enemyDefs = [
  {x:560,  min:500,  max:900},
  {x:1200, min:1040, max:1400},
  {x:1500, min:1430, max:1680},
  {x:1960, min:1830, max:2200},
  {x:2450, min:2300, max:2740}
];

const GOAL_X = 3060;

/* ================= 入力 ================= */
const input = { left:false, right:false, jumpHeld:false };
let jumpBuffer = 0;

function bindButton(el, onDown, onUp){
  const down = e => { e.preventDefault(); el.classList.add('active'); onDown(); };
  const up   = e => { e.preventDefault(); el.classList.remove('active'); onUp(); };
  el.addEventListener('pointerdown', down);
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('pointerout', up);
  el.addEventListener('contextmenu', e => e.preventDefault());
}

bindButton(document.getElementById('btnLeft'),
  ()=>{ input.left = true; },  ()=>{ input.left = false; });

bindButton(document.getElementById('btnRight'),
  ()=>{ input.right = true; }, ()=>{ input.right = false; });

bindButton(document.getElementById('btnJump'),
  ()=>{ jumpBuffer = 0.14; input.jumpHeld = true; },
  ()=>{ input.jumpHeld = false; if (player.vy < -300) player.vy = -300; });

/* キーボード（PC確認用） */
window.addEventListener('keydown', e=>{
  if (e.repeat) { if(e.key===' ') e.preventDefault(); return; }
  const k = e.key;
  if (k === 'ArrowLeft'  || k === 'a' || k === 'A') input.left = true;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') input.right = true;
  if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W'){
    jumpBuffer = 0.14; input.jumpHeld = true; e.preventDefault();
  }
});
window.addEventListener('keyup', e=>{
  const k = e.key;
  if (k === 'ArrowLeft'  || k === 'a' || k === 'A') input.left = false;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') input.right = false;
  if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W'){
    input.jumpHeld = false;
    if (player.vy < -300) player.vy = -300;
    e.preventDefault();
  }
});
document.addEventListener('gesturestart', e=>e.preventDefault());

/* ================= ゲーム状態 ================= */
const GRAVITY  = 2200;
const JUMP_V   = -790;
const MAX_FALL = 1350;

const player = {
  x:60, y:340, w:28, h:40,
  vx:0, vy:0, onGround:false, face:1, coyote:0, runTime:0
};

let coins = [], enemies = [], particles = [];
let score = 0, coinCount = 0, time = 0;
let gameState = 'playing';   // playing | dead | won
let deathTimer = 0;

const coinUI  = document.getElementById('coinUI');
const scoreUI = document.getElementById('scoreUI');
function updateHUD(){
  coinUI.textContent  = coinCount;
  scoreUI.textContent = score;
}

/* ================= 初期化 ================= */
function initLevel(){
  coins = coinSpots.map(c => ({
    x:c[0], y:c[1], r:11, taken:false, phase:Math.random()*Math.PI*2
  }));
  enemies = enemyDefs.map(d => ({
    x:d.x, y:GROUND_Y-30, w:34, h:30,
    vx:-58, min:d.min, max:d.max,
    dead:false, timer:0, anim:Math.random()*10
  }));
  particles = [];
}

function respawnPlayer(){
  player.x = 60; player.y = 340;
  player.vx = 0; player.vy = 0;
  player.onGround = false; player.coyote = 0;
  player.face = 1;
}

function resetGame(){
  score = 0; coinCount = 0;
  gameState = 'playing';
  camX = 0;
  initLevel();
  respawnPlayer();
  updateHUD();
  hideMsg();
}

/* ================= パーティクル ================= */
function spawnParticles(x, y, color, n, power){
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2;
    const s = power*(0.4+Math.random()*0.9);
    particles.push({
      x, y,
      vx: Math.cos(a)*s,
      vy: Math.sin(a)*s - 60,
      life: 0.5+Math.random()*0.35,
      maxLife: 0.85,
      size: 3+Math.random()*4,
      color
    });
  }
}

function updateParticles(dt){
  for (let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.vy += 900*dt;
    p.x += p.vx*dt;
    p.y += p.vy*dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i,1);
  }
}

/* ================= プレイヤー ================= */
function die(){
  if (gameState !== 'playing') return;
  gameState = 'dead';
  deathTimer = 1.1;
  player.vy = -640;
  player.vx = 0;
  spawnParticles(player.x+14, player.y+20, '#ff5a5a', 14, 260);
}

function updatePlayer(dt){
  const p = player;

  // --- 横移動 ---
  const accel = p.onGround ? 2800 : 1900;
  const MAXV  = 252;
  if (input.left && !input.right){
    p.vx -= accel*dt; p.face = -1;
  } else if (input.right && !input.left){
    p.vx += accel*dt; p.face = 1;
  } else {
    const fr = (p.onGround ? 2600 : 900)*dt;
    if (p.vx > 0) p.vx = Math.max(0, p.vx - fr);
    else if (p.vx < 0) p.vx = Math.min(0, p.vx + fr);
  }
  p.vx = clamp(p.vx, -MAXV, MAXV);

  // --- 重力 ---
  p.vy = Math.min(p.vy + GRAVITY*dt, MAX_FALL);

  // --- ジャンプ ---
  jumpBuffer -= dt;
  if (jumpBuffer > 0 && (p.onGround || p.coyote > 0)){
    p.vy = JUMP_V;
    p.onGround = false;
    p.coyote = 0;
    jumpBuffer = 0;
    spawnParticles(p.x+p.w/2, p.y+p.h, 'rgba(255,255,255,0.8)', 5, 90);
  }

  // --- X 移動と衝突 ---
  p.x += p.vx*dt;
  for (const s of solids){
    if (aabb(p, s)){
      if (p.vx > 0)      p.x = s.x - p.w;
      else if (p.vx < 0) p.x = s.x + s.w;
      p.vx = 0;
    }
  }
  if (p.x < 0){ p.x = 0; p.vx = 0; }
  if (p.x + p.w > LEVEL_W){ p.x = LEVEL_W - p.w; p.vx = 0; }

  // --- Y 移動と衝突 ---
  p.y += p.vy*dt;
  p.onGround = false;
  for (const s of solids){
    if (aabb(p, s)){
      if (p.vy > 0){
        p.y = s.y - p.h;
        p.vy = 0;
        p.onGround = true;
      } else if (p.vy < 0){
        p.y = s.y + s.h;
        p.vy = 0;
      }
    }
  }

  // --- コヨーテタイム ---
  if (p.onGround) p.coyote = 0.1;
  else p.coyote = Math.max(0, p.coyote - dt);

  // --- 走りアニメ ---
  if (p.onGround && Math.abs(p.vx) > 20) p.runTime += dt*Math.abs(p.vx)*0.05;
  else p.runTime = 0;

  // --- 落下死 ---
  if (p.y > 760) die();
}

/* ================= 敵 ================= */
function updateEnemies(dt){
  for (let i=enemies.length-1;i>=0;i--){
    const e = enemies[i];

    if (e.dead){
      e.timer -= dt;
      if (e.timer <= 0) enemies.splice(i,1);
      continue;
    }

    if (gameState === 'playing'){
      e.x += e.vx*dt;
      if (e.x < e.min){ e.x = e.min; e.vx = Math.abs(e.vx); }
      if (e.x + e.w > e.max){ e.x = e.max - e.w; e.vx = -Math.abs(e.vx); }
      e.anim += dt*6;

      // プレイヤーとの当たり判定
      if (aabb(player, e)){
        const prevBottom = player.y + player.h - player.vy*dt;
        if (player.vy > 0 && prevBottom <= e.y + 12){
          // 踏みつけ
          e.dead = true;
          e.timer = 0.45;
          player.vy = -560;
          score += 100;
          updateHUD();
          spawnParticles(e.x+e.w/2, e.y+e.h/2, '#c98a4b', 12, 200);
        } else {
          die();
        }
      }
    } else {
      e.anim += dt*3;
    }
  }
}

/* ================= コイン ================= */
function updateCoins(){
  const cx = player.x + player.w/2, cy = player.y + player.h/2;
  for (const c of coins){
    if (c.taken) continue;
    const dx = cx - c.x, dy = cy - c.y;
    if (dx*dx + dy*dy < (c.r + 20)*(c.r + 20)){
      c.taken = true;
      coinCount++;
      score += 50;
      updateHUD();
      spawnParticles(c.x, c.y, '#ffd23f', 10, 180);
    }
  }
}

/* ================= ゴール ================= */
function checkGoal(){
  if (player.x + player.w > GOAL_X){
    gameState = 'won';
    score += 500;
    updateHUD();
    spawnParticles(GOAL_X, 200, '#ffd23f', 30, 320);
    spawnParticles(GOAL_X, 240, '#5ee36a', 24, 280);
    setTimeout(()=>{
      showMsg('STAGE CLEAR!',
        'スコア ' + score + ' ／ コイン ' + coinCount + '枚');
    }, 700);
  }
}

/* ================= カメラ ================= */
function updateCamera(dt){
  const maxX = Math.max(0, LEVEL_W - viewW);
  const target = clamp(player.x + player.w/2 - viewW*0.42, 0, maxX);
  camX += (target - camX) * Math.min(1, dt*9);
  camX = clamp(camX, 0, maxX);
}

/* ================= 更新 ================= */
function update(dt){
  time += dt;

  if (gameState === 'playing'){
    updatePlayer(dt);
    updateCoins();
    checkGoal();
    updateCamera(dt);
  } else if (gameState === 'dead'){
    deathTimer -= dt;
    player.vy = Math.min(player.vy + GRAVITY*dt, MAX_FALL);
    player.y += player.vy*dt;
    if (deathTimer <= 0){
      gameState = 'playing';
      respawnPlayer();
      camX = clamp(player.x - viewW*0.42, 0, Math.max(0, LEVEL_W-viewW));
    }
  }

  updateEnemies(dt);
  updateParticles(dt);
}

/* ================= 描画：背景 ================= */
const clouds = [];
for (let i=0;i<18;i++){
  clouds.push({
    x: i*250 + (i%3)*70,
    y: 40 + (i%4)*58,
    s: 0.75 + (i%3)*0.28
  });
}
const hills = [];
for (let i=0;i<24;i++){
  hills.push({ x: i*330 + 120, r: 100 + (i%3)*46 });
}

function drawCloud(x,y,s){
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(s,s);
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.beginPath();
  ctx.arc(0,0,26,0,Math.PI*2);
  ctx.arc(32,-10,32,0,Math.PI*2);
  ctx.arc(68,2,23,0,Math.PI*2);
  ctx.arc(34,12,26,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawSky(){
  ctx.setTransform(scale,0,0,scale,0,0);

  const g = ctx.createLinearGradient(0,0,0,viewH);
  g.addColorStop(0,   '#3fa9ff');
  g.addColorStop(0.5, '#9fdcff');
  g.addColorStop(1,   '#e9f8ff');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,viewW,viewH);

  const groundScreenY = GROUND_Y - camY;

  // 太陽
  ctx.fillStyle = 'rgba(255,246,180,0.95)';
  ctx.beginPath();
  ctx.arc(viewW - 110, 96, 48, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,246,180,0.22)';
  ctx.beginPath();
  ctx.arc(viewW - 110, 96, 82, 0, Math.PI*2);
  ctx.fill();

  // 雲
  for (const c of clouds){
    const sx = c.x - camX*0.35;
    if (sx < -260 || sx > viewW + 260) continue;
    drawCloud(sx, c.y, c.s);
  }

  // 遠くの丘
  ctx.fillStyle = '#9ee07c';
  for (const h of hills){
    const sx = h.x - camX*0.55;
    if (sx < -h.r-40 || sx > viewW + h.r + 40) continue;
    ctx.beginPath();
    ctx.arc(sx, groundScreenY + 26, h.r, Math.PI, 0);
    ctx.fill();
  }

  // 手前の丘
  ctx.fillStyle = '#7ed957';
  for (const h of hills){
    const sx = h.x + 170 - camX*0.75;
    if (sx < -h.r-40 || sx > viewW + h.r + 40) continue;
    ctx.beginPath();
    ctx.arc(sx, groundScreenY + 34, h.r*0.72, Math.PI, 0);
    ctx.fill();
  }
}

/* ================= 描画：ワールド ================= */
function drawGround(s){
  ctx.fillStyle = '#a9713f';
  ctx.fillRect(s.x, s.y, s.w, s.h);

  ctx.fillStyle = 'rgba(0,0,0,0.09)';
  for (let x = s.x + 8; x < s.x + s.w - 10; x += 46){
    for (let y = s.y + 34; y < s.y + s.h - 12; y += 34){
      ctx.fillRect(x + ((y/34)%2 ? 14 : 0), y, 11, 11);
    }
  }

  ctx.fillStyle = '#57c84d';
  ctx.fillRect(s.x, s.y, s.w, 20);
  ctx.fillStyle = '#48b03f';
  ctx.fillRect(s.x, s.y + 20, s.w, 7);

  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.fillRect(s.x, s.y + 2, s.w, 4);
}

function drawPlatform(s){
  ctx.fillStyle = '#d99a52';
  roundRect(ctx, s.x, s.y, s.w, s.h, 8);
  ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  roundRect(ctx, s.x+6, s.y+4, s.w-12, 5, 3);
  ctx.fill();

  ctx.strokeStyle = 'rgba(120,70,20,0.6)';
  ctx.lineWidth = 2;
  roundRect(ctx, s.x, s.y, s.w, s.h, 8);
  ctx.stroke();
}

function drawGoal(){
  if (GOAL_X < camX - 120 || GOAL_X > camX + viewW + 120) return;
  const baseY = GROUND_Y;

  // 土台
  ctx.fillStyle = '#b8b8c8';
  roundRect(ctx, GOAL_X - 22, baseY - 26, 44, 26, 6);
  ctx.fill();
  ctx.fillStyle = '#8f8fa3';
  roundRect(ctx, GOAL_X - 22, baseY - 12, 44, 12, 4);
  ctx.fill();

  // ポール
  ctx.fillStyle = '#e8e8f0';
  ctx.fillRect(GOAL_X - 4, baseY - 250, 8, 226);
  ctx.fillStyle = '#c3c3d4';
  ctx.fillRect(GOAL_X + 1, baseY - 250, 3, 226);

  // 玉
  ctx.fillStyle = '#ffd23f';
  ctx.beginPath();
  ctx.arc(GOAL_X, baseY - 254, 11, 0, Math.PI*2);
  ctx.fill();

  // 旗（なびく）
  const wave = Math.sin(time*4) * 6;
  ctx.fillStyle = '#ff4d4d';
  ctx.beginPath();
  ctx.moveTo(GOAL_X + 4, baseY - 244);
  ctx.quadraticCurveTo(GOAL_X + 52, baseY - 232 + wave, GOAL_X + 86, baseY - 210 - wave);
  ctx.lineTo(GOAL_X + 4, baseY - 186);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath();
  ctx.moveTo(GOAL_X + 4, baseY - 244);
  ctx.quadraticCurveTo(GOAL_X + 40, baseY - 236 + wave*0.6, GOAL_X + 60, baseY - 224 - wave*0.6);
  ctx.lineTo(GOAL_X + 4, baseY - 210);
  ctx.closePath();
  ctx.fill();
}

function drawCoin(c){
  const bob = Math.sin(time*3 + c.phase) * 4;
  const sw  = Math.abs(Math.cos(time*3.4 + c.phase));
  ctx.save();
  ctx.translate(c.x, c.y + bob);
  ctx.scale(sw*0.82 + 0.18, 1);

  ctx.fillStyle = 'rgba(255,210,63,0.35)';
  ctx.beginPath(); ctx.arc(0,0,15,0,Math.PI*2); ctx.fill();

  ctx.fillStyle = '#ffd23f';
  ctx.beginPath(); ctx.arc(0,0,11,0,Math.PI*2); ctx.fill();

  ctx.fillStyle = '#f0a500';
  ctx.beginPath(); ctx.arc(0,0,7,0,Math.PI*2); ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath(); ctx.arc(-3,-3.5,2.6,0,Math.PI*2); ctx.fill();

  ctx.restore();
}

function drawEnemy(e){
  const cx = e.x + e.w/2;
  const by = e.y + e.h;

  ctx.save();
  if (e.dead){
    const k = clamp(e.timer/0.45, 0, 1);
    ctx.translate(cx, by);
    ctx.scale(1 + (1-k)*0.5, k);
    ctx.translate(-cx, -by);
    ctx.globalAlpha = k;
  } else {
    const wob = Math.sin(e.anim) * 2;
    ctx.translate(0, wob*0.4);
  }

  // 影
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  ctx.beginPath();
  ctx.ellipse(cx, by - 1, 17, 5, 0, 0, Math.PI*2);
  ctx.fill();

  // 足
  ctx.fillStyle = '#5a3216';
  const step = Math.sin(e.anim*1.6) * 4;
  ctx.beginPath(); ctx.ellipse(cx-9+step, by-4, 8, 5, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx+9-step, by-4, 8, 5, 0, 0, Math.PI*2); ctx.fill();

  // 体
  ctx.fillStyle = '#8b4a1e';
  ctx.beginPath();
  ctx.ellipse(cx, by - 15, 17, 15, 0, Math.PI, 0);
  ctx.lineTo(cx + 17, by - 6);
  ctx.lineTo(cx - 17, by - 6);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#b3672c';
  ctx.beginPath();
  ctx.ellipse(cx, by - 16, 13, 11, 0, Math.PI, 0);
  ctx.fill();

  // 顔
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(cx-6, by-16, 4.5, 5.5, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx+6, by-16, 4.5, 5.5, 0, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = '#1a1a1a';
  const look = e.vx < 0 ? -1.5 : 1.5;
  ctx.beginPath(); ctx.arc(cx-6+look, by-16, 2.3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+6+look, by-16, 2.3, 0, Math.PI*2); ctx.fill();

  // 眉
  ctx.strokeStyle = '#3a1f0a';
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.moveTo(cx-10, by-23); ctx.lineTo(cx-3, by-21);
  ctx.moveTo(cx+10, by-23); ctx.lineTo(cx+3, by-21);
  ctx.stroke();

  ctx.restore();
}

function drawPlayer(){
  const p = player;
  const x = p.x, y = p.y, w = p.w, h = p.h;
  const facing = p.face;

  // 影
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath();
  ctx.ellipse(x + w/2, y + h + 2, 15, 5, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.save();
  ctx.translate(x + w/2, y + h/2);
  ctx.scale(facing, 1);
  ctx.translate(-(x + w/2), -(y + h/2));

  const run = p.runTime;
  const legSwing = (p.onGround && Math.abs(p.vx) > 20) ? Math.sin(run*1.4)*5 : 0;

  // 靴
  ctx.fillStyle = '#5a3a1a';
  ctx.beginPath();
  ctx.ellipse(x + 8 + legSwing,  y + h - 4, 8, 5, 0, 0, Math.PI*2);
  ctx.ellipse(x + w - 8 - legSwing, y + h - 4, 8, 5, 0, 0, Math.PI*2);
  ctx.fill();

  // ズボン
  ctx.fillStyle = '#2b62d9';
  ctx.fillRect(x + 3, y + 22, w - 6, h - 26);

  // シャツ
  ctx.fillStyle = '#e63946';
  ctx.fillRect(x + 2, y + 16, w - 4, 9);

  // 腕
  ctx.fillStyle = '#e63946';
  ctx.beginPath();
  ctx.ellipse(x + 2, y + 21, 5, 6, 0, 0, Math.PI*2);
  ctx.ellipse(x + w - 2, y + 21, 5, 6, 0, 0, Math.PI*2);
  ctx.fill();

  // 手
  ctx.fillStyle = '#ffc9a0';
  ctx.beginPath();
  ctx.arc(x + 2, y + 26, 4, 0, Math.PI*2);
  ctx.arc(x + w - 2, y + 26, 4, 0, Math.PI*2);
  ctx.fill();

  // 顔
  ctx.fillStyle = '#ffc9a0';
  roundRect(ctx, x + 4, y + 4, w - 8, 14, 4);
  ctx.fill();

  // もみあげ
  ctx.fillStyle = '#6b3a1a';
  ctx.fillRect(x + 3, y + 10, 4, 7);

  // 帽子
  ctx.fillStyle = '#e63946';
  roundRect(ctx, x + 2, y + 1, w - 4, 8, 4);
  ctx.fill();
  ctx.fillRect(x + 1, y + 7, w - 2, 3.5);
  ctx.fillStyle = '#c62b38';
  ctx.fillRect(x + 1, y + 9, w - 2, 2);

  // 目
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(x + w - 11, y + 10, 3, 4.5);
  ctx.fillStyle = '#fff';
  ctx.fillRect(x + w - 10, y + 11, 1.2, 1.6);

  // 口ひげ
  ctx.fillStyle = '#6b3a1a';
  ctx.fillRect(x + w - 13, y + 15, 10, 3);

  ctx.restore();
}

function drawParticle(p){
  const a = clamp(p.life / p.maxLife, 0, 1);
  ctx.globalAlpha = a;
  ctx.fillStyle = p.color;
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.size * a, 0, Math.PI*2);
  ctx.fill();
  ctx.globalAlpha = 1;
}

function drawWorld(){
  const left = camX - 120, right = camX + viewW + 120;

  for (const s of solids){
    if (s.x + s.w < left || s.x > right) continue;
    if (s.ground) drawGround(s);
    else drawPlatform(s);
  }

  drawGoal();

  for (const c of coins){
    if (c.taken) continue;
    if (c.x < left || c.x > right) continue;
    drawCoin(c);
  }

  for (const e of enemies){
    if (e.x + e.w < left || e.x > right) continue;
    drawEnemy(e);
  }

  if (gameState !== 'won') drawPlayer();

  for (const p of particles) drawParticle(p);
}

/* ================= メイン描画 ================= */
function render(){
  drawSky();

  ctx.setTransform(scale, 0, 0, scale, -camX*scale, -camY*scale);
  drawWorld();

  ctx.setTransform(1,0,0,1,0,0);
}

/* ================= メッセージ ================= */
const msgEl    = document.getElementById('msg');
const msgTitle = document.getElementById('msgTitle');
const msgSub   = document.getElementById('msgSub');

function showMsg(title, sub){
  msgTitle.textContent = title;
  msgSub.textContent   = sub;
  msgEl.classList.add('show');
}
function hideMsg(){ msgEl.classList.remove('show'); }

document.getElementById('msgBtn').addEventListener('click', ()=>{
  resetGame();
});

/* ================= ループ ================= */
let last = performance.now();
function loop(now){
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  update(dt);
  render();

  requestAnimationFrame(loop);
}

document.addEventListener('visibilitychange', ()=>{
  last = performance.now();
});

/* ================= 開始 ================= */
resetGame();
requestAnimationFrame(loop);

})();
</script>
